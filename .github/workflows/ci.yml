name: CI

on:
  push:
    branches:
      - master
      - 'feature/*'
      - 'test/*'
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install dependencies
      run: |
        cd vscode-extension
        npm ci

    - name: Build
      run: |
        cd vscode-extension
        npm run compile

    - name: Run tests
      run: |
        cd vscode-extension
        xvfb-run -a npm run test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        fail_ci_if_error: false
