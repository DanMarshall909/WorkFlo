name: Release

on:
  push:
    branches: [main]  # Production branch
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Install frontend dependencies
      run: |
        cd src/web
        npm ci
    
    - name: Build for release
      run: |
        dotnet build --configuration Release --no-restore
        cd src/web && npm run build
    
    - name: Run full test suite
      run: |
        dotnet test --configuration Release --no-build
        cd src/web && npm run test:ci
    
    - name: Package CLI tool
      run: |
        dotnet pack src/WorkFlo.Cli/WorkFlo.Cli.csproj --configuration Release --no-build
    
    - name: Publish CLI tool
      run: |
        dotnet publish src/WorkFlo.Cli/WorkFlo.Cli.csproj --configuration Release --no-build --output dist/cli
    
    - name: Create release archives
      run: |
        mkdir -p release
        tar -czf release/workflo-cli-linux.tar.gz -C dist/cli .
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: release/